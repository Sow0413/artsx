name: Survey
options:
  bundleIdPrefix: com.artshome
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  groupSortPosition: top
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 9PT57JQMVT
packages:
  SurveyCore:
    path: SurveyCore
targets:
  SurveyApp:
    type: application
    platform: iOS
    sources:
      - path: SurveyApp
        excludes:
          - Info.plist
    dependencies:
      - package: SurveyCore
        product: SurveyCore
      - sdk: PushToTalk.framework
        weak: true
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artshome.artsx
        PRODUCT_NAME: artsx
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SurveyApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      gatherCoverageData: false
  SurveyWatch:
    type: application
    platform: watchOS
    sources:
      - path: SurveyWatch
    dependencies:
      - package: SurveyCore
        product: SurveyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artshome.artsx.watch
        PRODUCT_NAME: artsxWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: artsx
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.artshome.artsx
        INFOPLIST_KEY_NSMotionUsageDescription: "転倒と強い衝撃を、加速度から補助的に見るために使います。緊急通報の代わりではありません。"
        INFOPLIST_KEY_NSFallDetectionUsageDescription: "Apple Watch の転倒を受け取り、近くの端末に知らせます。緊急通報の代わりではありません。"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    scheme:
      gatherCoverageData: false
