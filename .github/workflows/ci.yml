name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Archive and upload to TestFlight
        type: boolean
        default: false

jobs:
  surveycore-linux:
    name: SurveyCore tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zip zlib1g-dev
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          mkdir -p /tmp/swiftly-src
          tar -xzf /tmp/swiftly.tar.gz -C /tmp/swiftly-src
          /tmp/swiftly-src/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes "$(tr -d '[:space:]' < .swift-version)"
          swift --version
      - name: Test SurveyCore
        run: |
          set -euo pipefail
          . "$HOME/.local/share/swiftly/env.sh"
          cd SurveyCore
          swift test

  ios-build:
    name: Unsigned iOS build (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode_app"
          echo "selected ${xcode_app}"
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Test SurveyCore
        run: |
          set -euo pipefail
          cd SurveyCore
          swift test
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Build SurveyApp without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  ios-ui:
    name: iOS UI (simulator)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode_app"
          echo "selected ${xcode_app}"
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphonesimulator --show-sdk-version)"
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Boot an iPhone 16 or 17 simulator
        id: sim
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/sim.txt
          import json, subprocess, sys
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          data = json.loads(raw)
          found = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS-26" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable", True):
                      found.append((device["name"], device["udid"]))
          for preferred in ("iPhone 17", "iPhone 16"):
              for name, udid in found:
                  if name == preferred:
                      print(udid)
                      print(name)
                      sys.exit(0)
          for preferred in ("iPhone 17", "iPhone 16"):
              for name, udid in found:
                  if name.startswith(preferred):
                      print(udid)
                      print(name)
                      sys.exit(0)
          print("iPhone 16/17 on iOS 26 was not found", file=sys.stderr)
          subprocess.run(["xcrun", "simctl", "list", "devices", "available"])
          sys.exit(1)
          PY
          udid="$(sed -n '1p' /tmp/sim.txt)"
          name="$(sed -n '2p' /tmp/sim.txt)"
          echo "simulator ${name} ${udid}"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
      - name: Build for the simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$PWD/build/ui" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            build-for-testing
      - name: Screenshot launch, +5s, and +15s
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          app="$(find "$PWD/build/ui" -path '*iphonesimulator*' -name 'Survey.app' -type d | head -1)"
          test -n "$app"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          echo "bundle ${bundle}"
          mkdir -p "$PWD/build/ui-screenshots"
          xcrun simctl install "$udid" "$app"
          xcrun simctl privacy "$udid" grant location "$bundle" || true
          xcrun simctl privacy "$udid" grant location-always "$bundle" || true
          xcrun simctl privacy "$udid" grant motion "$bundle" || true
          xcrun simctl privacy "$udid" grant microphone "$bundle" || true
          xcrun simctl privacy "$udid" grant camera "$bundle" || true
          xcrun simctl location "$udid" set 35.1156,136.9021
          xcrun simctl launch "$udid" "$bundle" -skipStatureAsk
          xcrun simctl io "$udid" screenshot "$PWD/build/ui-screenshots/launch.png"
          sleep 5
          xcrun simctl io "$udid" screenshot "$PWD/build/ui-screenshots/plus5.png"
          sleep 10
          xcrun simctl io "$udid" screenshot "$PWD/build/ui-screenshots/plus15.png"
          xcrun simctl terminate "$udid" "$bundle" || true
      - name: Run the UI test
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination "platform=iOS Simulator,id=${udid}" \
            -derivedDataPath "$PWD/build/ui" \
            -resultBundlePath "$PWD/build/ui/SurveyUI.xcresult" \
            -only-testing:SurveyUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            test-without-building
      - name: Collect step screenshots
        if: always()
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          dest="$PWD/build/ui-screenshots/steps"
          mkdir -p "$dest"
          device="$HOME/Library/Developer/CoreSimulator/Devices/$udid"
          find "$device/data" -path '*/survey-ui-shots/*.png' -exec cp {} "$dest/" \; || true
          ls -l "$PWD/build/ui-screenshots" "$dest" || true
      - name: Upload screenshots and xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui
          path: |
            build/ui-screenshots/
            build/ui/SurveyUI.xcresult
          if-no-files-found: warn

  testflight:
    name: TestFlight upload
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        run: |
          set -euo pipefail
          xcode_app="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode_app"
          echo "selected ${xcode_app}"
          xcodebuild -version
          echo "iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Sign and upload when the API key is present
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID || '9PT57JQMVT' }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          MARKETING_VERSION: ${{ vars.MARKETING_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_ISSUER_ID}" ] || [ -z "${ASC_KEY_ID}" ] || [ -z "${ASC_KEY_P8}" ]; then
            echo "ASC_ISSUER_ID / ASC_KEY_ID / ASC_KEY_P8 が無いので、署名とアップロードは飛ばします。"
            echo "署名なしビルドは別のジョブです。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          brew install xcodegen
          xcodegen generate
          key_dir="$HOME/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir" build
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$key_path"
          else
            if ! printf '%s' "$ASC_KEY_P8" | tr -d ' \n' | base64 --decode > "$key_path" 2>/dev/null; then
              printf '%s' "$ASC_KEY_P8" | tr -d ' \n' | base64 -D > "$key_path"
            fi
          fi
          chmod 600 "$key_path"
          printf '\n' >> "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "ASC_KEY_P8 を秘密鍵として読めませんでした。" >&2
            exit 1
          fi
          trap 'rm -f "$key_path"' EXIT
          if [ -n "${ASC_TEAM_ID}" ]; then
            team="$ASC_TEAM_ID"
          else
            team="$(
              xcrun altool --list-providers \
                --apiKey "$ASC_KEY_ID" \
                --apiIssuer "$ASC_ISSUER_ID" \
                --output-format json \
              | python3 -c '
          import json, sys
          raw = sys.stdin.read()
          data = json.loads(raw[raw.find("{"):])
          teams = []
          def walk(node):
              if isinstance(node, dict):
                  value = node.get("WWDRTeamID")
                  if isinstance(value, str) and len(value) == 10:
                      teams.append(value)
                  for child in node.values():
                      walk(child)
              elif isinstance(node, list):
                  for child in node:
                      walk(child)
          walk(data)
          unique = list(dict.fromkeys(teams))
          if len(unique) == 0:
              raise SystemExit("WWDRTeamID がありません。ASC_TEAM_ID を Secret に置いてください。")
          if len(unique) > 1:
              raise SystemExit("チームが複数あります。ASC_TEAM_ID を Secret に置いてください。")
          print(unique[0])
          '
            )"
          fi
          bundle="${BUNDLE_ID:-com.artshome.artsx}"
          version="${MARKETING_VERSION:-1.1}"
          echo "bundle ${bundle}, version ${version} (${GITHUB_RUN_NUMBER})"
          echo "archive は署名しない。export で App Store 配布用に署名する。"
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${team}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          # 開発用プロファイルは端末が要る。archive ではチームも自動署名も渡さない。
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$PWD/build/Survey.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$bundle" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
          # export が Apple Distribution の証明書と App Store 用プロファイルを作る。端末は要らない。
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Survey.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
