name: Survey
options:
  bundleIdPrefix: jp.oshiro
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja
  groupSortPosition: top
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  SurveyCore:
    path: SurveyCore
targets:
  SurveyApp:
    type: application
    platform: iOS
    sources:
      - path: SurveyApp
        excludes:
          - Info.plist
    dependencies:
      - package: SurveyCore
        product: SurveyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.oshiro.survey
        PRODUCT_NAME: Survey
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SurveyApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      gatherCoverageData: false
