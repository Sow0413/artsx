name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Archive and upload to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  surveycore-linux:
    name: SurveyCore tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the TestFlight identity
        run: sh scripts/check-ios-release.sh
      - name: Install Swift
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zip zlib1g-dev
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          mkdir -p /tmp/swiftly-src
          tar -xzf /tmp/swiftly.tar.gz -C /tmp/swiftly-src
          /tmp/swiftly-src/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes "$(tr -d '[:space:]' < .swift-version)"
          swift --version
      - name: Test SurveyCore
        run: |
          set -euo pipefail
          . "$HOME/.local/share/swiftly/env.sh"
          cd SurveyCore
          swift test

  ios-build:
    name: Unsigned iOS build (macOS)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check the TestFlight identity
        run: sh scripts/check-ios-release.sh
      - name: Test SurveyCore
        run: |
          set -euo pipefail
          cd SurveyCore
          swift test
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Build artsx without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  testflight:
    name: TestFlight upload
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-15
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the App Store Connect API key
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ASC_KEY_ID}" ] || missing="${missing} ASC_KEY_ID"
          [ -n "${ASC_ISSUER_ID}" ] || missing="${missing} ASC_ISSUER_ID"
          [ -n "${ASC_KEY_P8}" ] || missing="${missing} ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "TestFlight には次の Repository secrets が要ります:${missing}" >&2
            echo "任意: ASC_TEAM_ID, BUILD_CERTIFICATE_BASE64, BUILD_CERTIFICATE_PASSWORD" >&2
            echo "置き場所: GitHub → Settings → Secrets and variables → Actions" >&2
            exit 1
          fi
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Sign and upload artsx
        run: |
          set -euo pipefail
          team="${ASC_TEAM_ID:-9PT57JQMVT}"
          bundle="com.artshome.artsx"
          version="1.0"
          build_number="$GITHUB_RUN_NUMBER"
          key_dir="$RUNNER_TEMP/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir" build
          umask 077
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_KEY_P8" | sed 's/\\n/\n/g' > "$key_path"
          else
            if ! printf '%s' "$ASC_KEY_P8" | tr -d ' \n' | base64 --decode > "$key_path" 2>/dev/null; then
              printf '%s' "$ASC_KEY_P8" | tr -d ' \n' | base64 -D > "$key_path"
            fi
          fi
          chmod 600 "$key_path"
          printf '\n' >> "$key_path"
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "ASC_KEY_P8 を秘密鍵として読めませんでした。" >&2
            exit 1
          fi
          cleanup() {
            rm -f "$key_path"
            if [ -n "${keychain:-}" ]; then
              security delete-keychain "$keychain" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          if [ -n "${BUILD_CERTIFICATE_BASE64}" ]; then
            if [ -z "${BUILD_CERTIFICATE_PASSWORD}" ]; then
              echo "BUILD_CERTIFICATE_BASE64 があるので、BUILD_CERTIFICATE_PASSWORD も要ります。" >&2
              exit 1
            fi
            keychain="$RUNNER_TEMP/app-signing.keychain-db"
            keychain_pass="$(openssl rand -hex 16)"
            cert_path="$RUNNER_TEMP/distribution.p12"
            printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d ' \n' | base64 --decode > "$cert_path" 2>/dev/null \
              || printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d ' \n' | base64 -D > "$cert_path"
            security create-keychain -p "$keychain_pass" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_pass" "$keychain"
            security import "$cert_path" -k "$keychain" -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_pass" "$keychain"
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm -f "$cert_path"
          fi
          echo "team ${team}, bundle ${bundle}, version ${version} (${build_number})"
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${team}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$PWD/build/artsx.xcarchive" \
            DEVELOPMENT_TEAM="$team" \
            CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$bundle" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$build_number" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/artsx.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
