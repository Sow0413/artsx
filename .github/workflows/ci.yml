name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Archive and upload to TestFlight
        type: boolean
        default: false

jobs:
  surveycore-linux:
    name: SurveyCore tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils curl gnupg2 libc6-dev libcurl4-openssl-dev libedit2 libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev libxml2-dev libz3-dev pkg-config tzdata unzip zip zlib1g-dev
          curl -fsSL -o /tmp/swiftly.tar.gz "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          mkdir -p /tmp/swiftly-src
          tar -xzf /tmp/swiftly.tar.gz -C /tmp/swiftly-src
          /tmp/swiftly-src/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "$HOME/.local/share/swiftly/env.sh"
          swiftly install --use --assume-yes "$(tr -d '[:space:]' < .swift-version)"
          swift --version
      - name: Test SurveyCore
        run: |
          set -euo pipefail
          . "$HOME/.local/share/swiftly/env.sh"
          cd SurveyCore
          swift test

  ios-build:
    name: Unsigned iOS build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test SurveyCore
        run: |
          set -euo pipefail
          cd SurveyCore
          swift test
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Build SurveyApp without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  testflight:
    name: TestFlight upload
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require signing secrets
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEVELOPMENT_TEAM"
          test -n "$APPSTORE_ISSUER_ID"
          test -n "$APPSTORE_KEY_ID"
          test -n "$APPSTORE_PRIVATE_KEY"
      - name: Generate the Xcode project
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
      - name: Archive and upload
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build
          printf '%s' "$APPSTORE_PRIVATE_KEY" > build/AuthKey.p8
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -project Survey.xcodeproj \
            -scheme SurveyApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$PWD/build/Survey.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/build/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/Survey.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/build/AuthKey.p8" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          rm -f build/AuthKey.p8
